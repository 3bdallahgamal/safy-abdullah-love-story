<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 03 — How Well Do You Know Us?</title><link rel="stylesheet" href="style.css?v=4"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet"></head><body>
<nav><div class="brand">Safy <b>&</b> Abdullah</div><div class="navlinks"><a href="index.html">Home</a><a href="memories.html">Memories</a><a href="date.html">Date With Me</a></div></nav>
<main class="page dark"><div class="wrap"><div class="center"><div class="eyebrow">Chapter 03 · A little test</div><h1>How well do you<br><span>know us?</span></h1><p class="lead">Four tiny questions. No pressure… but I’m watching. 👀❤️</p></div>
<div id="quiz" class="card" style="max-width:760px;margin:30px auto"><div class="eyebrow" id="counter">Question 01 · 04</div><h2 id="question" style="color:var(--ink);font-size:clamp(28px,5vw,44px)">Ready?</h2><div id="answers" class="story-choices"></div><div class="nextrow"><button id="next" class="btn" onclick="next()" disabled>Next question →</button></div></div>
<div id="result" class="card center hide" style="max-width:760px;margin:30px auto"><div class="eyebrow">Your result</div><h2 id="resultTitle" style="color:var(--ink);font-size:40px">You know us pretty well. ❤️</h2><p id="resultText" class="lead"></p><div class="actions"><a class="btn" href="date.html">Discover what's next →</a></div></div>
<div class="center actions"><a class="btn alt" href="memories.html">← Previous</a></div></div></main><footer>Chapter 03 · S&A</footer>
<script>
const questions=[
{q:"Where did our story really begin?",a:["With a random conversation","On a perfect planned day","At a fancy restaurant","I honestly don't know"],c:0},
{q:"What matters most in one of our memories?",a:["The perfect picture","The place we were at","The feeling we shared","How expensive the day was"],c:2},
{q:"What would Abdullah choose for a simple date?",a:["A long conversation","A crowded party","A business meeting","Staying completely silent"],c:0},
{q:"If we could keep only one thing from our story, what should it be?",a:["The photos","The places","The memories and feeling","The receipts"],c:2}
];
let i=0,score=0,selected=-1;
function render(){selected=-1;document.getElementById('counter').textContent='Question '+String(i+1).padStart(2,'0')+' · 04';document.getElementById('question').textContent=questions[i].q;const box=document.getElementById('answers');box.innerHTML='';questions[i].a.forEach((x,n)=>{const b=document.createElement('button');b.className='story-choice';b.innerHTML='<span class="choice-icon">'+['①','②','③','④'][n]+'</span><strong>'+x+'</strong>';b.onclick=()=>{selected=n;box.querySelectorAll('.story-choice').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');document.getElementById('next').disabled=false};box.appendChild(b)});document.getElementById('next').textContent=i===questions.length-1?'See my result ❤️':'Next question →';document.getElementById('next').disabled=true}
function next(){if(selected<0)return;if(selected===questions[i].c)score++;i++;if(i<questions.length)render();else{document.getElementById('quiz').classList.add('hide');document.getElementById('result').classList.remove('hide');document.getElementById('resultText').textContent=score===4?'Okay… you really know us. ❤️':score>=2?'You know us pretty well. ❤️ But there are still a few things only I know about you.':'You might need a few more memories with me. ❤️'}}render();
</script></body></html>
